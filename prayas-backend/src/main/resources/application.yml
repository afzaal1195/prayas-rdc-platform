spring:
  application:
    name: prayas-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prayas}
    username: ${DB_USER:prayas}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [email, profile]

server:
  port: ${PORT:8080}

# --- Prayas-specific config -------------------------------------------
# Every value here was set with the team on 2026-09-22 unless noted.
prayas:
  tour:
    max-per-day: 3                 # daily cap on approved campus tours
    headcount-freeze-days: 2       # school can self-edit headcount up to 2 day before the visit
    requirement-lead-days: 5       # requirement due_date = visit_date - 5 (not yet confirmed with team)
    min-advance-days: 3            # public request must be submitted at least 3 days before the visit
    earliest-arrival: "09:30"      # campus hours -- no visits accepted outside this window
    latest-departure: "18:00"
    min-visit-duration-hours: 3    # minimum gap required between arrival and departure
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}   # React dev server; override in prod
  auth:
    allowed-email-domain: iith.ac.in   # only these Google accounts can log in as staff
  captcha:
    secret: ${HCAPTCHA_SECRET:}

logging:
  level:
    com.prayas.platform: INFO